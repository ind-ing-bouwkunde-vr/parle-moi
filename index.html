<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parle-moi">
<title>Parle-moi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1C1733">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Plan: French is always set in the italic serif, Dutch in the sans — the type itself tells you which language you're looking at.
   One-column phone app, fixed bottom tab bar, bleu-blanc-rouge kept to two accents on a lilac-grey paper. */
:root{
  --paper:#F4F1F9; --surface:#FFFFFF; --ink:#1C1733; --muted:#6A6386; --line:#E0D9EE;
  --rouge:#D93A28; --bleu:#2B45C9; --bleu-soft:#E6EAFB; --rouge-soft:#FBE7E3; --ok:#1F8A55; --ok-soft:#E1F3E9;
  --fr:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --nl:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13111F; --surface:#1E1A30; --ink:#EFEBF8; --muted:#A49DBD; --line:#2F2A47;
    --rouge:#FF6A55; --bleu:#8A9DFF; --bleu-soft:#262B52; --rouge-soft:#3A2024; --ok:#4CC88A; --ok-soft:#183427;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13111F; --surface:#1E1A30; --ink:#EFEBF8; --muted:#A49DBD; --line:#2F2A47;
  --rouge:#FF6A55; --bleu:#8A9DFF; --bleu-soft:#262B52; --rouge-soft:#3A2024; --ok:#4CC88A; --ok-soft:#183427;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--nl);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
.fr{font-family:var(--fr);font-style:italic;font-weight:400;letter-spacing:.005em}
.app{display:flex;flex-direction:column;height:100%}
header.top{padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{font-family:var(--fr);font-style:italic;font-size:34px;line-height:1;letter-spacing:-.01em}
.brand b{font-weight:400;color:var(--rouge)}
.streak{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
.streak .n{font-variant-numeric:tabular-nums;color:var(--ink);font-size:18px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 28px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.gear{color:var(--muted);display:grid;place-items:center}
.lyr{display:flex;flex-direction:column;gap:2px}
.lline{display:grid;grid-template-columns:1fr 1fr 28px;gap:4px 14px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.lyr.stack .lline{grid-template-columns:1fr 28px}
.lyr.stack .lline .tr{grid-column:1;grid-row:2}
.lline .src{font-family:var(--fr);font-style:italic;font-size:20px;line-height:1.3}
.lline .tr{font-size:15px;color:var(--muted)}
.lgap{height:14px}
.w{cursor:pointer;border-radius:4px;padding:0 1px}
.w.mark{background:var(--rouge-soft);color:var(--rouge)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:16px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0}
.sheet .fr{font-size:28px}
select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px}
label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:6px}
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--rouge)}
h1{font-family:var(--fr);font-style:italic;font-weight:400;font-size:38px;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:700}
h3{margin:0;font-size:17px}
p{margin:0}
.sub{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--rouge);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.alt{background:var(--bleu-soft);color:var(--bleu)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bleu-soft);color:var(--bleu);white-space:nowrap}
.pill.r{background:var(--rouge-soft);color:var(--rouge)}
.pill.g{background:var(--ok-soft);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.task.done{opacity:.6}
.task.done .tt{text-decoration:line-through}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.tt{font-weight:700}
.td{font-size:14px;color:var(--muted)}
.mins{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.item{display:flex;flex-direction:column;gap:8px}
.item .title{font-family:var(--fr);font-style:italic;font-size:26px;line-height:1.1}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:13px;font-weight:700;color:var(--bleu);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.prep{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.wl{display:grid;grid-template-columns:1fr 1fr auto;gap:6px 10px;align-items:center;font-size:15px}
.wl .fr{font-size:19px}
.plus{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 8px;font-weight:700;color:var(--bleu)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;display:flex;flex-direction:column;gap:6px}
.msg.ai{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.ai .fr{font-size:21px;line-height:1.25}
.msg.me{background:var(--bleu);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.me .fr{font-size:20px;line-height:1.25}
.fix{align-self:flex-end;max-width:88%;background:var(--ok-soft);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.fix .fr{font-size:19px;color:var(--ok)}
.tiny{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--bleu);font-weight:700;font-size:13px}
.composer{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--paper);padding-top:8px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:17px;resize:none}
textarea.frin,input.frin{font-family:var(--fr);font-style:italic;font-size:21px}
.prompt{font-size:22px;font-weight:700;line-height:1.25;text-wrap:balance}
.target{font-size:28px;line-height:1.2}
.result{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.result.ok{background:var(--ok-soft)}
.result.no{background:var(--rouge-soft)}
.result.mid{background:var(--bleu-soft)}
.tok{padding:0 2px;border-radius:4px}
.tok.hit{color:var(--ok)}
.tok.miss{color:var(--rouge);text-decoration:underline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px;min-height:56px;font-size:15px;font-weight:600;text-align:center}
.tile.frt{font-family:var(--fr);font-style:italic;font-weight:400;font-size:20px}
.tile[aria-pressed="true"]{border-color:var(--bleu);background:var(--bleu-soft)}
.tile.gone{visibility:hidden}
.tile.bad{border-color:var(--rouge);background:var(--rouge-soft)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rouge);transition:width .3s}
.scen{display:grid;grid-template-columns:1fr;gap:8px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:2px}
.scen button b{font-size:16px}
.scen button span{font-size:14px;color:var(--muted)}
.word{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.word .fr{font-size:20px}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.flash{min-height:150px;justify-content:center;align-items:center;text-align:center}
.note{font-size:14px;color:var(--muted);background:var(--bleu-soft);border-radius:12px;padding:10px 12px}
.note b{color:var(--ink)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.bar i{transition:none}}
.hide{display:none!important}
details summary{cursor:pointer;font-weight:700}
ol.steps{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
</style>
</head>

<script>
/* ---------------- Data ---------------- */
const NAME = "Axelle";

const CATALOG = [
  {id:"angele",type:"muziek",title:"Angèle",who:"Belgische pop",plat:["spotify"],lvl:"makkelijk",why:"Catchy pop zoals Sabrina Carpenter en Ariana Grande, en ze komt uit Brussel.",start:"Begin met ‘Bruxelles je t’aime’ en ‘Tout oublier’."},
  {id:"pomme",type:"muziek",title:"Pomme",who:"Franse singer-songwriter",plat:["spotify"],lvl:"makkelijk",why:"Zachte, persoonlijke liedjes in de sfeer van Gracie Abrams en Noah Kahan.",start:"Luister het album ‘Les failles’."},

/* ---------------- State ---------------- */
const BOX_DAYS = [0,1,3,7,14,30];
function dayKey(d=new Date()){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function dayNum(d=new Date()){return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/864e5)}
const DEFAULT = {v:1,updated:0,days:{},words:[],plan:{},songs:{},ai:{prov:"gemini",key:"",model:""}};
let S = JSON.parse(JSON.stringify(DEFAULT));
const LS_KEY = "parlemoi.v1";
function loadState(obj){S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),obj||{}); S.ai=Object.assign({prov:"gemini",key:"",model:""},S.ai||{}); S.songs=S.songs||{}}
try{const raw=localStorage.getItem(LS_KEY); if(raw) loadState(JSON.parse(raw))}catch(e){}
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
}
function today(){const k=dayKey(); if(!S.days[k]) S.days[k]={s:0,w:0,done:[]}; return S.days[k]}
function logFrench(text){
  const n=(text||"").trim().split(/\s+/).filter(Boolean).length; if(!n) return;
  const t=today(); t.s+=1; t.w+=n; save(); updateStreak();
}
function markDone(kind){const t=today(); if(!t.done.includes(kind)){t.done.push(kind); save(); updateStreak();}}
function streak(){
  let n=0; const d=new Date();
  const active=k=>S.days[k]&&(S.days[k].s>0||S.days[k].done.length>0);
  if(!active(dayKey(d))) d.setDate(d.getDate()-1);
  while(active(dayKey(d))){n++; d.setDate(d.getDate()-1);}
  return n;
}
function updateStreak(){const n=streak(); document.getElementById("streakN").textContent=n; document.getElementById("streakL").textContent=n===1?"dag op rij":"dagen op rij"}

function addWord(fr,nl){
  fr=(fr||"").trim(); nl=(nl||"").trim(); if(!fr) return false;
  if(S.words.some(w=>norm(w.fr)===norm(fr))) return false;
  S.words.push({fr,nl,box:0,due:dayNum()}); save(); return true;
}

/* ---------------- Text helpers ---------------- */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i]; for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1))} p=c} return p[n]}
function sim(a,b){a=norm(a);b=norm(b); const L=Math.max(a.length,b.length)||1; return 1-lev(a,b)/L}
function bestMatch(ans,list){let best={s:0,t:list[0]}; for(const t of list){const s=sim(ans,t); if(s>best.s) best={s,t}} return best}
function seeded(seed){let x=seed%2147483647; if(x<=0)x+=2147483646; return ()=> (x=x*16807%2147483647)/2147483647}
function shuffle(arr,rnd=Math.random){const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]} return a}

/* ---------------- Uitspraak (stem van je toestel) ---------------- */
let frVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices(); frVoice=vs.find(v=>/^fr[-_]BE/i.test(v.lang))||vs.find(v=>/^fr[-_]FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null}catch(e){}}
try{pickVoice(); speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(text,rate=0.9){
  try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=frVoice?frVoice.lang:"fr-FR"; if(frVoice) u.voice=frVoice; u.rate=rate; speechSynthesis.speak(u)}catch(e){}
}

/* ---------------- AI met je eigen sleutel ---------------- */
const PROVIDERS={
  gemini:{l:"Google Gemini",model:"gemini-flash-latest",keyUrl:"https://aistudio.google.com/apikey"},
  openai:{l:"OpenAI",model:"gpt-5-mini",keyUrl:"https://platform.openai.com/api-keys"},
  anthropic:{l:"Anthropic",model:"claude-haiku-5-5",keyUrl:"https://console.anthropic.com/settings/keys"}
};
function aiReady(){return !!(S.ai&&S.ai.key)}
async function askJSON(prompt){
  if(!aiReady()) throw {code:"none"};
  const prov=PROVIDERS[S.ai.prov]?S.ai.prov:"gemini"; const key=S.ai.key.trim(); const model=(S.ai.model||"").trim()||PROVIDERS[prov].model;
  const full=prompt+"\n\nAntwoord met alleen geldige JSON, zonder uitleg ervoor of erna.";
  let res, text="";
  try{
    if(prov==="gemini"){
      res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{role:"user",parts:[{text:full}]}],generationConfig:{responseMimeType:"application/json",temperature:0.8}})});
      if(res.ok){const d=await res.json(); text=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("")}
    }else if(prov==="openai"){
      res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model,messages:[{role:"user",content:full}],response_format:{type:"json_object"}})});
      if(res.ok){const d=await res.json(); text=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||""}
    }else{
      res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:2500,messages:[{role:"user",content:full}]})});
      if(res.ok){const d=await res.json(); text=(d.content||[]).map(c=>c.text||"").join("")}
    }
  }catch(e){throw {code:"network"}}
  if(!res.ok){throw {code:res.status===401||res.status===403?"key":res.status===429?"rate_limited":res.status===404?"model":res.status===400?"bad":"http",status:res.status}}
  const m=text.match(/[\{\[][\s\S]*[\}\]]/); if(!m) throw {code:"parse"};
  return JSON.parse(m[0]);
}
function aiError(e){
  const c=e&&e.code;
  if(c==="none") return "Voor Léa heb je een eigen API-sleutel nodig. Stel die in via het tandwiel rechtsboven. Zonder sleutel kun je de geleide oefeningen gebruiken.";
  if(c==="key") return "Je API-sleutel werkt niet. Kijk hem na via het tandwiel rechtsboven.";
  if(c==="rate_limited") return "Je zit aan de limiet van je API-sleutel. Wacht een minuutje en probeer opnieuw.";
  if(c==="model"||c==="bad") return "Het model werd niet aanvaard. Kijk de modelnaam (en je sleutel) na via het tandwiel.";
  if(c==="network") return "Geen verbinding met de AI. Check je internet.";
  return "Dat lukte niet. Probeer het nog eens.";
}

/* ---------------- Inspreken ---------------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function micButton(id){
  if(!SR) return "";
  return `<button class="btn alt small" type="button" data-mic="${id}">🎤 Inspreken</button>`;
}
function wireMics(root){
  if(!SR) return;
  root.querySelectorAll("[data-mic]").forEach(b=>b.onclick=()=>{
    if(rec){try{rec.stop()}catch(e){} return}
    const ta=document.getElementById(b.dataset.mic); if(!ta||ta.disabled) return;
    try{rec=new SR()}catch(e){return}
    rec.lang="fr-FR"; rec.interimResults=true; rec.continuous=false;
    const base=ta.value.trim();
    rec.onresult=ev=>{let t=""; for(const r of ev.results) t+=r[0].transcript; ta.value=(base+" "+t).trim()};
    rec.onend=()=>{rec=null; b.textContent="🎤 Inspreken"};
    rec.onerror=ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){ if(!b.nextElementSibling||!b.nextElementSibling.classList.contains("micerr")) b.insertAdjacentHTML("afterend",'<span class="tiny micerr">Microfoon niet toegestaan: gebruik de 🎤 op je toetsenbord.</span>') } };
    b.textContent="■ Stop";
    try{rec.start()}catch(e){rec=null; b.textContent="🎤 Inspreken"}
  });
}
function keyboardHint(){
  return `<p class="tiny">${SR?"Of gebruik":"Spreek in met"} de 🎤 op je iPhone-toetsenbord, met het Franse toetsenbord aan (🌐).</p>`;
}

/* ---------------- Daily plan ---------------- */
function todaysPicks(){
  const n=dayNum();
  const songs=CATALOG.filter(c=>c.type==="muziek");
  const watch=CATALOG.filter(c=>c.type==="serie"||c.type==="film"||c.type==="licht");
  return {song:songs[n%songs.length], watch:watch[(n*3)%watch.length]};
}
function planFor(mins){
  const {song,watch}=todaysPicks();
  const t=[{k:"zeg",t:"Zeg het in het Frans",d:"5 zinnen uit het Nederlands zelf vertalen en uitspreken.",m:3,go:"#speel",arg:"zeg"}];
  if(mins===5){
    t.push({k:"shadow",t:"Nazeggen",d:"3 zinnen beluisteren en hardop nazeggen.",m:2,go:"#speel",arg:"shadow"});
  }else{
    t.push({k:"luister",t:"Luister: "+song.title,d:song.start,m:4,go:"#ontdek",arg:song.id});
    if(mins===30) t.push({k:"kijk",t:"Kijk: "+watch.title,d:"Kijk ongeveer 15 à 20 minuten. "+watch.start,m:18,go:"#ontdek",arg:watch.id});
    t.push({k:"praat",t:"Praat erover",d:"Vertel over "+(mins===30?watch.title:song.title)+": met Léa, of geleid met 3 vragen.",m:6,go:"#praat",arg:mins===30?watch.id:song.id});
    if(mins===15) t.push({k:"flits",t:"Woordflits",d:"Snel 5 woordparen koppelen.",m:2,go:"#speel",arg:"flits"});
  }
  return t;
}

/* ---------------- Router & render ---------------- */
let routeArg=null;
const VIEWS=["vandaag","ontdek","liedjes","praat","speel","woorden","instellingen"];
function go(hash,arg){routeArg=arg??null; if(location.hash===hash) render(); else location.hash=hash}
window.addEventListener("hashchange",()=>render());
function current(){const h=(location.hash||"").slice(1); return VIEWS.includes(h)?h:"vandaag"}
function render(){
  const v=current();
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v?"page":"false"));
  const root=document.getElementById("view");
  closeSheet();
  ({vandaag:vToday,ontdek:vOntdek,liedjes:vLiedjes,praat:vPraat,speel:vSpeel,woorden:vWoorden,instellingen:vInstellingen})[v](root);
  wireMics(root);
}

    </div>
    ${mins?`<h2>Jouw plan voor vandaag</h2>
      <div class="wrap" style="gap:8px">${tasks.map(x=>{const d=t.done.includes(x.k); return `

        </div>`}).join("")}</div>`
    :`<div class="card"><p>Kies hierboven je tijd en je krijgt een plan op maat. Met 5 minuten oefen je kort spreken, met 30 minuten kijk je ook een stukje van een serie.</p></div>`}
    <div class="stats">
      <div class="stat"><div class="v">${t.s}</div><div class="l">zinnen vandaag</div></div>
      <div class="stat"><div class="v">${t.w}</div><div class="l">Franse woorden gemaakt</div></div>
      <div class="stat"><div class="v">${S.words.length}</div><div class="l">in je woordenlijst${due?` · ${due} te herhalen`:""}</div></div>
    </div>
    <div class="note"><b>Tip van de dag:</b> ${esc(TIPS[dayNum()%TIPS.length])}</div>
    <details class="card"><summary>Op je iPhone zetten</summary>
      <ol class="steps">
        <li>Open de link van deze app in <b>Safari</b>.</li>
        <li>Tik op <b>Deel</b> (vierkantje met pijl) → <b>Zet op beginscherm</b>.</li>
        <li>Instellingen → Algemeen → Toetsenbord → Toetsenborden → <b>Frans</b> toevoegen.</li>
        <li>In de app: tik op 🌐 om naar Frans te wisselen en op 🎤 om in te spreken.</li>
      </ol>
    </details>`;
  root.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.plan[k]=+b.dataset.m; save(); render()});
  root.querySelectorAll(".check").forEach(b=>b.onclick=()=>{const kk=b.dataset.k; const i=t.done.indexOf(kk); if(i>=0) t.done.splice(i,1); else t.done.push(kk); save(); updateStreak(); render()});
  root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go,b.dataset.arg));
}

/* ---------- Liedjes (jij plakt de tekst) ---------- */
let songEdit=null, songView=null, sideBySide=true, songBusy=false, songErr="";
function vLiedjes(root){

function geniusUrl(t,a){return "https://genius.com/search?q="+encodeURIComponent((a+" "+t).trim())}
function songForm(root){
  const e=songEdit;
  root.innerHTML=`
    <div class="row" style="justify-content:space-between"><button class="btn ghost small" id="cancel">← Terug</button></div>
    <h1>${e.id?"Liedje bewerken":"Nieuw liedje"}</h1>

      <a id="gen" class="tiny" href="${geniusUrl(e.title,e.artist)}" target="_blank" rel="noopener" style="color:var(--bleu);font-weight:700">Zoek de tekst op Genius ↗</a>
      <label for="sx">Songtekst in het Frans (plakken)<textarea id="sx" class="frin" rows="10" placeholder="Plak hier de tekst, één regel per lijn">${esc(e.text)}</textarea></label>
      <label for="sv">Vertaling (optioneel, zelfde regels)<textarea id="sv" rows="6" placeholder="Plak een vertaling, of laat ze later maken met AI">${esc(e.trans)}</textarea></label>
      <p class="tiny">De tekst blijft alleen op je eigen toestel bewaard.</p>
      <button class="btn" type="submit">Bewaar</button>
    </form>`;
  const upd=()=>{root.querySelector("#gen").href=geniusUrl(root.querySelector("#st").value,root.querySelector("#sa").value)};
  root.querySelector("#st").oninput=upd; root.querySelector("#sa").oninput=upd;
  root.querySelector("#cancel").onclick=()=>{songView=e.id; songEdit=null; render()};
  root.querySelector("#sf").onsubmit=ev=>{
    ev.preventDefault();
    const text=root.querySelector("#sx").value.replace(/\r/g,"").trim(); if(!text) return;
    const id=e.id||Date.now().toString(36);
    const lines=text.split("\n").map(l=>l.trim());
    const tr=root.querySelector("#sv").value.replace(/\r/g,"").split("\n").map(l=>l.trim());
    const old=S.songs[id]||{};
    S.songs[id]={title:root.querySelector("#st").value.trim(),artist:root.querySelector("#sa").value.trim(),lines,trans:tr.some(Boolean)?lines.map((_,i)=>tr[i]||""):[],marked:old.marked||[],added:old.added||Date.now()};
    save(); songEdit=null; songView=id; markDone("luister"); render();

async function translateSong(id){
  const s=S.songs[id];
  if(!aiReady()){songErr=aiError({code:"none"})+" Je kunt ook zelf een vertaling plakken via ‘Bewerk’."; render(); return}
  songBusy=true; songErr=""; render();
  try{
    const v=await askJSON(`Vertaal deze Franse songtekst regel per regel naar natuurlijk Nederlands, voor een Vlaamse student die Frans leert. De tekst komt van de gebruiker zelf.
Geef JSON {"regels":[...]} met precies ${s.lines.length} strings, in dezelfde volgorde. Een lege regel blijft een lege string.
Regels:
${s.lines.map((l,i)=>(i+1)+". "+l).join("\n")}`);
    const r=Array.isArray(v)?v:(v.regels||[]);
    s.trans=s.lines.map((l,i)=>l?String(r[i]||"").replace(/^\d+\.\s*/,""):""); save();
  }catch(e){songErr=aiError(e)}
  songBusy=false; if(current()==="liedjes") render();
}
function closeSheet(){const o=document.getElementById("sheet"); if(o) o.remove()}
function openWordSheet(id,word,li){
  closeSheet();
  const s=S.songs[id]; const key=norm(word); const known=S.words.find(w=>norm(w.fr)===key);
  const el=document.createElement("div"); el.className="sheet"; el.id="sheet"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Woord");
  el.innerHTML=`
    <div class="row" style="justify-content:space-between"><span class="fr">${esc(word)}</span><span class="row"><button class="btn ghost small" id="wsay">🔊</button><button class="btn ghost small" id="wclose">Sluit</button></span></div>
    <p class="tiny">In de regel: <span class="fr" style="font-size:17px">${esc(s.lines[li])}</span></p>
    <label for="wnl">Betekenis<input type="text" id="wnl" value="${esc(known?known.nl:"")}" placeholder="Wat betekent het?" autocomplete="off"></label>
    <p class="tiny" id="wmsg"></p>
    <div class="row" style="justify-content:space-between">
      ${aiReady()?`<button class="btn alt small" id="wai">Vertaal met AI</button>`:`<span class="tiny">Tip: een AI-sleutel vult de betekenis automatisch in.</span>`}
      <button class="btn" id="wsave">${known?"Bewaar":"+ Woordenlijst"}</button>
    </div>`;
  document.body.appendChild(el);
  el.querySelector("#wclose").onclick=closeSheet;
  el.querySelector("#wsay").onclick=()=>speak(word,.8);
  const ai=el.querySelector("#wai");
  if(ai) ai.onclick=async()=>{
    ai.disabled=true; el.querySelector("#wmsg").innerHTML='<span class="spin"></span> Even opzoeken…';
    try{const v=await askJSON(`Wat betekent het Franse woord "${word}" in deze zin: "${s.lines[li]}"? Geef JSON {"basisvorm":"woordenboekvorm, bv. infinitief","nl":"korte Nederlandse betekenis in deze context"}`);
      el.querySelector("#wnl").value=v.nl||""; el.querySelector("#wmsg").textContent=v.basisvorm&&norm(v.basisvorm)!==key?"Basisvorm: "+v.basisvorm:"";
    }catch(e){el.querySelector("#wmsg").textContent=aiError(e)}
    ai.disabled=false;
  };
  el.querySelector("#wsave").onclick=()=>{
    const nl=el.querySelector("#wnl").value.trim();
    if(known) known.nl=nl||known.nl; else addWord(word,nl);
    s.marked=s.marked||[]; if(!s.marked.includes(key)) s.marked.push(key);
    save(); closeSheet(); render();
  };
}

  else if(mode==="dag") guided={mode,label:"Mijn dag",steps:DAY_STEPS.map(([fr,nl])=>({starter:fr,nl})),i:0};
  else guided={mode:"item",label:obj.title,steps:(PREP[obj.id]||{vragen:QS_SERIE}).vragen.map(q=>({q})),i:0};
}

  const g=guided;

      <div class="row" style="justify-content:space-between">
        ${st.res?`<span></span><button class="btn" id="next">Volgende</button>`:`${micButton("gin")}<span></span><button class="btn" id="chk">${g.mode==="scen"?"Check":"Klaar"}</button>`}
      </div>

    </div>`;
  root.querySelector("#back").onclick=()=>{guided=null; render()};

  const nx=root.querySelector("#next"); if(nx) nx.onclick=()=>{g.i++; render()};

    const ans=root.querySelector("#gin").value.trim(); if(!ans) return;
    st.user=ans; logFrench(ans);

      st.res={lvl,t:m.t}; render();
    }else{ g.i++; render() }

function startChat(mode,obj){
  guided=null;
  let ctx="",label="";
  if(mode==="vrij"){ctx="Een losse babbel tussen vriendinnen over Axelle's dag, studie, weekend of hobby's."; label="Babbel"}
  if(mode==="dag"){ctx="Axelle vertelt over haar dag (dagelijkse spraakmemo). Help haar om in ongeveer 5 beurten te vertellen wat ze vandaag deed. Stel korte vervolgvragen."; label="Mijn dag"}
  if(mode==="scen"){ctx="Rollenspel. "+obj.ctx.replace(/Léa/g,"jij")+" Blijf in je rol."; label=obj.t}
  if(mode==="item"){ctx=`Jullie praten over "${obj.title}" (${TYPELABEL[obj.type]}, ${obj.who}). Vraag wat Axelle ervan vond, wat ze hoorde of zag, en wat haar favoriete personage of nummer is. Verzin geen details over het werk als je ze niet zeker weet.`; label=obj.title}
  chat={mode,ctx,label,turns:[],busy:false,err:""};
  aiTurn();
}
async function sendChat(text){
  chat.turns.push({who:"me",fr:text}); logFrench(text);
  await aiTurn();
}
async function aiTurn(){
  chat.busy=true; chat.err=""; if(current()==="praat") render();
  const history=chat.turns.map(t=>(t.who==="ai"?"Léa: ":"Axelle: ")+t.fr).join("\n");
  const prompt=`Je bent Léa, een vriendelijke, grappige Franstalige gesprekspartner uit Brussel. Je praat met Axelle, een Vlaamse studente bouwkunde die Frans vrij goed begrijpt maar zelf moeilijk op de woorden komt (niveau A2). Doel: haar zoveel mogelijk zelf laten praten.
Situatie: ${chat.ctx}
Regels:
- Antwoord in eenvoudig, natuurlijk Frans (A2–B1): maximaal 2 à 3 korte zinnen, en eindig bijna altijd met één concrete vraag.
- Als Axelle Nederlands gebruikt of Nederlands en Frans mengt, zet in "verbetering" de volledige Franse zin die ze bedoelde, zodat ze die kan nazeggen. Reageer daarna gewoon verder in het Frans.
- Verbeter alleen echte fouten in haar laatste bericht, kort en vriendelijk. Was het goed, laat "verbetering" en "uitleg" leeg.
- Citeer nooit songteksten of dialogen uit films of series.
Geef JSON: {"antwoord":"jouw beurt in het Frans","vertaling":"Nederlandse vertaling van je beurt","verbetering":"verbeterde versie van Axelle's laatste bericht, of lege string","uitleg":"heel korte uitleg in het Nederlands, of lege string"}
${history?"Gesprek tot nu toe:\n"+history+"\n\nSchrijf nu de volgende beurt van Léa.":"Open het gesprek met een korte begroeting en een eerste vraag."}`;
  try{
    const r=await askJSON(prompt);
    const last=[...chat.turns].reverse().find(t=>t.who==="me");
    if(last&&r.verbetering&&norm(r.verbetering)!==norm(last.fr)){last.fix=r.verbetering; last.uitleg=r.uitleg||""}
    chat.turns.push({who:"ai",fr:r.antwoord||"…",nl:r.vertaling||""});
    if(chat.turns.filter(t=>t.who==="me").length>=5){ markDone(chat.mode==="dag"?"memo":"praat") }
  }catch(e){ chat.err=aiError(e) }
  chat.busy=false; if(current()==="praat") render();
}

    try{const v=await askJSON('Geef JSON {"zin":"een korte, vrolijke Franse begroeting voor Axelle"}'); setMsg="Het werkt! Léa zegt: "+(v.zin||"Bonjour !")}catch(e){setMsg=aiError(e)}
    if(current()==="instellingen") render()};
  const dump=()=>JSON.stringify(Object.assign({},S,{ai:Object.assign({},S.ai,{key:""})}));
  root.querySelector("#dl").onclick=()=>{const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([dump()],{type:"application/json"})); a.download="parle-moi-backup-"+dayKey()+".json"; a.click()};
  root.querySelector("#cp").onclick=()=>{navigator.clipboard.writeText(dump()).then(()=>root.querySelector("#bkmsg").textContent="Gekopieerd.").catch(()=>root.querySelector("#bkmsg").textContent="Kopiëren lukte niet.")};
  root.querySelector("#rs").onclick=()=>{try{const o=JSON.parse(root.querySelector("#restore").value); const key=S.ai.key; loadState(o); if(!S.ai.key) S.ai.key=key; save(); updateStreak(); root.querySelector("#bkmsg").textContent="Teruggezet."}catch(e){root.querySelector("#bkmsg").textContent="Dat is geen geldige back-up."}};
}

/* ---------- Speel ---------- */
let game=null; let gameTab="zeg";
function vSpeel(root){
  const arg=routeArg; routeArg=null;
  if(arg&&["zeg","shadow","flits"].includes(arg)){gameTab=arg; game=null}
  root.innerHTML=`
    <div><h1>Speel</h1><p class="sub" style="margin-top:6px">Korte spelletjes om woorden zelf boven te halen.</p></div>
    <div class="chips" role="group" aria-label="Spel">
      <button class="chip" id="g-zeg" data-g="zeg" aria-pressed="${gameTab==="zeg"}">Zeg het</button>
      <button class="chip" id="g-shadow" data-g="shadow" aria-pressed="${gameTab==="shadow"}">Nazeggen</button>
      <button class="chip" id="g-flits" data-g="flits" aria-pressed="${gameTab==="flits"}">Woordflits</button>
    </div>
    <div id="gamebox" class="wrap" style="gap:12px"></div>`;
  root.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{gameTab=b.dataset.g; game=null; render()});
  const box=root.querySelector("#gamebox");
  if(gameTab==="zeg") gZeg(box); else if(gameTab==="shadow") gShadow(box); else gFlits(box);
}
function newRound(kind){
  const rnd=seeded(Date.now());
  if(kind==="flits"){
    const due=S.words.filter(w=>w.due<=dayNum()&&w.nl&&w.fr.split(" ").length<=4).map(w=>[w.fr,w.nl]);
    const pool=shuffle(due,rnd).slice(0,3).concat(shuffle(VOCAB,rnd)).filter((p,i,a)=>a.findIndex(q=>q[0]===p[0])===i).slice(0,5);
    return {kind,pairs:pool,left:shuffle(pool.map((p,i)=>i),rnd),right:shuffle(pool.map((p,i)=>i),rnd),sel:null,matched:[],bad:null,start:Date.now(),mistakes:0};
  }
  const items=shuffle(PHRASES,rnd).slice(0,kind==="zeg"?5:3);
  return {kind,items,i:0,score:0,res:null,hint:0};
}
function progress(g,total){return `<div class="bar" aria-hidden="true"><i style="width:${Math.round(g.i/total*100)}%"></i></div>`}

function gZeg(box){
  if(!game||game.kind!=="zeg") game=newRound("zeg");
  const g=game;
  if(g.i>=g.items.length){
    markDone("zeg");
    box.innerHTML=`<div class="card flash"><p class="fr" style="font-size:34px">Bravo !</p><p>${g.score} van de ${g.items.length} in één keer goed. Zinnen die nog niet lukten staan in je woordenlijst.</p><button class="btn" id="again">Nog een ronde</button></div>`;
    box.querySelector("#again").onclick=()=>{game=null; render()}; return;
  }
  const [nl,frs]=g.items[g.i];
  const hint=g.hint?frs[0].split(" ").map((w,j)=>j<g.hint?w:w[0]+"…").join(" "):"";
  box.innerHTML=`${progress(g,g.items.length)}
    <div class="card">
      <span class="tiny">Zin ${g.i+1} van ${g.items.length} · zeg het hardop, en typ of spreek het dan in</span>
      <p class="prompt">${esc(nl)}</p>
      ${hint?`<p class="fr" style="font-size:20px;color:var(--muted)">${esc(hint)}</p>`:""}
      <textarea id="zin" class="frin" rows="2" placeholder="En français…" ${g.res?"disabled":""}></textarea>
      ${g.res?resultHTML(g.res):""}
      <div class="row" style="justify-content:space-between">
        ${g.res?`<button class="btn ghost small" id="say">🔊 Luister</button><button class="btn" id="next">Volgende</button>`:
        `<div class="row">${micButton("zin")}<button class="btn ghost small" id="hint">Hint</button><button class="btn ghost small" id="skip">Weet ik niet</button></div><button class="btn" id="chk">Check</button>`}
      </div>
      ${g.res?"":keyboardHint()}
    </div>`;
  const ta=box.querySelector("#zin"); if(g.res) ta.value=g.res.ans;
  if(g.res){
    box.querySelector("#say").onclick=()=>speak(g.res.target);
    box.querySelector("#next").onclick=()=>{g.i++; g.res=null; g.hint=0; render()};
    const ai=box.querySelector("#aichk"); if(ai) ai.onclick=()=>aiCheck(g,nl);
    return;
  }
  box.querySelector("#hint").onclick=()=>{g.hint=Math.min(g.hint+1,frs[0].split(" ").length); render()};
  box.querySelector("#skip").onclick=()=>{g.res={ok:false,lvl:"no",ans:"",target:frs[0]}; addWord(frs[0],nl); render(); speak(frs[0])};
  box.querySelector("#chk").onclick=()=>{
    const ans=ta.value.trim(); if(!ans) return;
    const m=bestMatch(ans,frs); logFrench(ans);
    const lvl=m.s>=.88?"ok":m.s>=.6?"mid":"no";
    if(lvl==="ok"&&!g.hint) g.score++;
    if(lvl!=="ok") addWord(m.t,nl);
    g.res={ok:lvl==="ok",lvl,ans,target:m.t}; render();
  };
}
function resultHTML(r){
  const head=r.lvl==="ok"?"Juist!":r.lvl==="mid"?"Bijna!":"Zo zeg je het:";
  return `<div class="result ${r.lvl}"><b>${head}</b><span class="fr" style="font-size:22px">${esc(r.target)}</span>
    ${r.ai?`<span class="tiny">${esc(r.ai)}</span>`:""}
    ${r.lvl!=="ok"&&r.ans&&aiReady()&&!r.ai?`<button class="linkbtn" id="aichk" style="align-self:flex-start">Ik zei het anders. Laat Léa checken</button>`:""}</div>`;
}
async function aiCheck(g,nl){
  const r=g.res; r.ai="Léa kijkt even…"; render();
  try{
    const v=await askJSON(`Axelle (Vlaamse, A2) moest deze Nederlandse zin in het Frans zeggen: "${nl}". Zij zei: "${r.ans}". Een mogelijk antwoord is: "${r.target}".
Is haar zin ook correct en natuurlijk Frans met dezelfde betekenis (kleine spel- of accentfouten door spraakherkenning tellen niet)? Geef JSON: {"correct":true/false,"uitleg":"1 korte zin in het Nederlands","verbeterd":"haar zin, verbeterd"}`);
    if(v.correct){r.lvl="ok"; r.ok=true; r.target=v.verbeterd||r.ans; r.ai=v.uitleg||"Ook goed!"}
    else {r.ai=v.uitleg||""; if(v.verbeterd) r.target=v.verbeterd}
  }catch(e){r.ai=aiError(e)}
  render();
}

function gShadow(box){
  if(!game||game.kind!=="shadow") game=newRound("shadow");
  const g=game;
  if(g.i>=g.items.length){
    markDone("shadow");
    box.innerHTML=`<div class="card flash"><p class="fr" style="font-size:34px">Très bien !</p><p>Je hebt ${g.items.length} zinnen nagezegd.</p><button class="btn" id="again">Nog een ronde</button></div>`;
    box.querySelector("#again").onclick=()=>{game=null; render()}; return;
  }
  const target=g.items[g.i][1][0];
  const show=g.show||g.res;
  box.innerHTML=`${progress(g,g.items.length)}
    <div class="card">
      <span class="tiny">1. Luister · 2. Zeg het hardop na · 3. Spreek het in om te checken</span>
      <p class="target fr ${show?"":"hide"}">${esc(target)}</p>
      ${show?"":`<p class="sub">Eerst alleen luisteren, zonder de tekst te zien.</p>`}
      <div class="row">
        <button class="btn alt" id="play">🔊 Luister</button>
        <button class="btn ghost" id="slow">🐢 Trager</button>
        ${show?"":`<button class="btn ghost small" id="reveal">Toon tekst</button>`}
      </div>
      <textarea id="sh" class="frin" rows="2" placeholder="Zeg het na…" ${g.res?"disabled":""}></textarea>
      ${g.res?`<div class="result ${g.res.lvl}"><b>${g.res.lvl==="ok"?"Super!":g.res.lvl==="mid"?"Bijna! Let op de rode woorden.":"Nog eens proberen?"}</b><span class="fr" style="font-size:22px">${g.res.html}</span></div>`:""}
      <div class="row" style="justify-content:space-between">
        ${g.res?`<button class="btn ghost small" id="retry">Opnieuw</button><button class="btn" id="next">Volgende</button>`:`${micButton("sh")}<span></span><button class="btn" id="chk">Check</button>`}
      </div>
      ${g.res?"":keyboardHint()}
    </div>`;
  box.querySelector("#play").onclick=()=>speak(target,.9);
  box.querySelector("#slow").onclick=()=>speak(target,.65);
  const rv=box.querySelector("#reveal"); if(rv) rv.onclick=()=>{g.show=true; render()};
  const ta=box.querySelector("#sh"); if(g.res) ta.value=g.res.ans;
  if(g.res){
    box.querySelector("#retry").onclick=()=>{g.res=null; render()};
    box.querySelector("#next").onclick=()=>{g.i++; g.res=null; g.show=false; render()};
    return;
  }
  box.querySelector("#chk").onclick=()=>{
    const ans=ta.value.trim(); if(!ans) return; logFrench(ans);
    const said=new Set(norm(ans).split(" "));
    const toks=target.split(/\s+/); let hit=0;
    const html=toks.map(w=>{const ok=norm(w).split(" ").every(p=>!p||said.has(p)); if(ok) hit++; return `<span class="tok ${ok?"hit":"miss"}">${esc(w)}</span>`}).join(" ");
    const ratio=hit/toks.length; const lvl=ratio>=.9?"ok":ratio>=.6?"mid":"no";
    g.res={ans,html,lvl}; g.show=true; render();
  };
}

function gFlits(box){
  if(!game||game.kind!=="flits") game=newRound("flits");
  const g=game;
  if(g.matched.length===g.pairs.length){
    markDone("flits");
    const sec=Math.round((g.end-g.start)/1000);
    box.innerHTML=`<div class="card flash"><p class="fr" style="font-size:34px">Génial !</p><p>Alle paren in ${sec} seconden, met ${g.mistakes} ${g.mistakes===1?"fout":"fouten"}.</p><button class="btn" id="again">Nog een ronde</button></div>`;
    box.querySelector("#again").onclick=()=>{game=null; render()}; return;
  }
  box.innerHTML=`<p class="tiny">Tik een Frans woord en dan de juiste vertaling. Tik daarna op het Franse woord om het te horen.</p>
    <div class="grid2">
      <div class="wrap" style="gap:8px">${g.left.map(i=>`<button class="tile frt ${g.matched.includes(i)?"gone":""}" id="L${i}" data-l="${i}" aria-pressed="${g.sel===i}">${esc(g.pairs[i][0])}</button>`).join("")}</div>
      <div class="wrap" style="gap:8px">${g.right.map(i=>`<button class="tile ${g.matched.includes(i)?"gone":""} ${g.bad===i?"bad":""}" id="R${i}" data-r="${i}">${esc(g.pairs[i][1])}</button>`).join("")}</div>
    </div>`;
  box.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{g.sel=+b.dataset.l; g.bad=null; speak(g.pairs[g.sel][0]); render()});
  box.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    if(g.sel===null) return; const r=+b.dataset.r;
    if(r===g.sel){g.matched.push(r); g.sel=null; g.bad=null; if(g.matched.length===g.pairs.length) g.end=Date.now()}
    else {g.mistakes++; g.bad=r; const p=g.pairs[g.sel]; addWord(p[0],p[1])}
    render();
  });
}

/* ---------- Woorden ---------- */
let review=null;
function vWoorden(root){
  const due=S.words.filter(w=>w.due<=dayNum());
  if(review){
    const w=review.list[review.i];
    if(!w){review=null; markDone("herhaal"); render(); return}
    root.innerHTML=`
      <div class="row" style="justify-content:space-between"><button class="btn ghost small" id="stop">← Stoppen</button><span class="pill">${review.i+1} / ${review.list.length}</span></div>
      <div class="card flash">
        <span class="tiny">Hoe zeg je dit in het Frans? Zeg het eerst hardop.</span>
        <p class="prompt">${esc(w.nl||"(zonder vertaling)")}</p>
        ${review.show?`<p class="fr" style="font-size:30px">${esc(w.fr)}</p>`:""}
      </div>
      ${review.show?`<div class="row" style="justify-content:space-between"><button class="btn ghost" id="say">🔊 Luister</button><div class="row"><button class="btn alt" id="no">Nog niet</button><button class="btn" id="yes">Wist ik</button></div></div>`
      :`<button class="btn" id="show">Toon antwoord</button>`}`;
    root.querySelector("#stop").onclick=()=>{review=null; render()};
    if(!review.show){root.querySelector("#show").onclick=()=>{review.show=true; render(); speak(w.fr)}; return}
    root.querySelector("#say").onclick=()=>speak(w.fr);
    root.querySelector("#yes").onclick=()=>{w.box=Math.min(w.box+1,BOX_DAYS.length-1); w.due=dayNum()+BOX_DAYS[w.box]; save(); review.i++; review.show=false; render()};
    root.querySelector("#no").onclick=()=>{w.box=0; w.due=dayNum(); save(); review.i++; review.show=false; render()};
    return;
  }
  root.innerHTML=`
    <div><h1>Woorden</h1><p class="sub" style="margin-top:6px">Jouw eigen lijst: woorden uit voorbereidingen, verbeteringen van Léa en zinnen die nog niet lukten.</p></div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><b>${due.length} om te herhalen</b><button class="btn" id="rev" ${due.length?"":"disabled"}>Herhaal nu</button></div>
      <p class="tiny">Wat je weet, komt later terug (na 1, 3, 7, 14 en 30 dagen). Wat je nog niet weet, komt morgen terug.</p>
    </div>
    <form class="card" id="addf">
      <b>Zelf een woord toevoegen</b>
      <input type="text" id="afr" class="frin" placeholder="Frans" autocomplete="off">
      <input type="text" id="anl" placeholder="Nederlands" autocomplete="off">
      <button class="btn alt" type="submit">Toevoegen</button>
    </form>
    <div>${S.words.length?S.words.slice().reverse().map((w,ri)=>{const i=S.words.length-1-ri; return `
      <div class="word"><span class="fr">${esc(w.fr)}</span><span class="dots" aria-label="Niveau ${w.box} van 5">${[1,2,3,4,5].map(n=>`<i class="${w.box>=n?"on":""}"></i>`).join("")}</span>
      <span class="tiny">${esc(w.nl)}</span><span class="row"><button class="linkbtn" data-sw="${i}">🔊</button><button class="linkbtn" data-del="${i}" style="color:var(--rouge)">Wis</button></span></div>`}).join("")
      :`<p class="sub">Nog leeg. Speel een ronde ‘Zeg het’ of bereid een liedje voor en je lijst vult zich vanzelf.</p>`}</div>`;
  root.querySelector("#rev").onclick=()=>{review={list:shuffle(due).slice(0,15),i:0,show:false}; render()};
  root.querySelector("#addf").onsubmit=e=>{e.preventDefault(); if(addWord(root.querySelector("#afr").value,root.querySelector("#anl").value)) render()};
  root.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>speak(S.words[+b.dataset.sw].fr));
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.words.splice(+b.dataset.del,1); save(); render()});
}

/* ---------------- Start ---------------- */
updateStreak(); render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
